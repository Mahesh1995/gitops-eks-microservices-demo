# External DNS watches Gateway API HTTPRoutes and keeps Route53 records in sync with the
# ALB the Gateway created. No manual DNS entries.
#
# Before applying:
#   1. Set the IRSA role ARN on the ServiceAccount annotation below
#      (terraform output -raw external_dns_role_arn).
#   2. Set --domain-filter and --txt-owner-id to your hosted zone / a unique owner id.
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-dns
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-dns
  namespace: external-dns
  annotations:
    # From terraform/irsa.tf output `external_dns_role_arn`:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/gitops-demo-external-dns
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: external-dns
rules:
  - apiGroups: [""]
    resources: ["services", "endpoints", "pods", "nodes"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["gateway.networking.k8s.io"]
    resources: ["gateways", "httproutes", "grpcroutes", "tlsroutes", "tcproutes", "udproutes"]
    verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: external-dns-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: external-dns
subjects:
  - kind: ServiceAccount
    name: external-dns
    namespace: external-dns
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
    spec:
      serviceAccountName: external-dns
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          args:
            - --source=gateway-httproute      # watch Gateway API HTTPRoutes
            - --provider=aws
            - --aws-zone-type=public
            - --registry=txt
            - --txt-owner-id=gitops-demo       # unique id so it only manages its own records
            - --domain-filter=example.com      # <-- your hosted zone; limits blast radius
            - --policy=upsert-only             # never delete records (safer for learning)
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "100m", memory: "128Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
