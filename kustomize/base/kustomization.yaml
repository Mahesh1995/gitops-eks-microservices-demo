apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Shared labels applied to every resource (modern replacement for commonLabels).
labels:
  - pairs:
      app.kubernetes.io/part-of: gitops-eks-microservices-demo
    includeSelectors: false

resources:
  - namespace.yaml
  - frontend.yaml
  - product-catalog.yaml
  - cart.yaml
  - redis.yaml
