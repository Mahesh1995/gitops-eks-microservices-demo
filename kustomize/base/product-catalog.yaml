apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: product-catalog
  template:
    metadata:
      labels:
        app.kubernetes.io/name: product-catalog
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "5000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: product-catalog
          image: ghcr.io/mahesh1995/product-catalog:dev
          ports:
            - containerPort: 5000
          resources:
            requests: { cpu: "25m", memory: "64Mi" }
            limits: { cpu: "150m", memory: "128Mi" }
          livenessProbe:
            httpGet: { path: /healthz, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: product-catalog
  labels:
    app.kubernetes.io/name: product-catalog
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: product-catalog
  ports:
    - name: http
      port: 5000
      targetPort: 5000
