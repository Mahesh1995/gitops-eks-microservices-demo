apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: gitops-demo

resources:
  - ../../base
  - hpa.yaml

# Prod pins immutable, CI-produced tags. Replace with the real commit SHA you deploy.
images:
  - name: ghcr.io/mahesh1995/frontend
    newTag: sha-REPLACE_ME
  - name: ghcr.io/mahesh1995/product-catalog
    newTag: sha-REPLACE_ME
  - name: ghcr.io/mahesh1995/cart
    newTag: sha-REPLACE_ME
  - name: ghcr.io/mahesh1995/checkout
    newTag: sha-REPLACE_ME

# Prod runs 2 replicas of the stateless services (HPA can scale further).
replicas:
  - name: frontend
    count: 2
  - name: product-catalog
    count: 2
  - name: cart
    count: 2
  - name: checkout
    count: 2

# Tighten logging to info in prod.
patches:
  - target:
      kind: Deployment
      name: frontend
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: info
